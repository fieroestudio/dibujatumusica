<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dibuja tu música</title>
<style>
  :root{ --bg:#ffffff; --paper:#fcfcfa; --line:#e7e5e0; --ink:#1d1d1b; --mute:#8d8a84;
         --key:clamp(44px,min(12vw,12vh),66px); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;overflow:hidden;
    user-select:none;-webkit-user-select:none;touch-action:none}
  body{display:flex;flex-direction:column}
  #title{flex:0 0 auto;margin:0;padding:16px 12px 4px;text-align:center;line-height:0}
  .ttl svg{display:inline-block;height:auto}
  #title svg{width:min(88vw,560px,60vh)}
  #hint .ttl{display:none;margin-bottom:.6em}
  #hint .ttl svg{width:min(82%,520px)}
  /* móvil en horizontal: el título no cabe arriba; va dentro del lienzo vacío */
  @media (orientation:landscape) and (max-height:600px){ #title{display:none} #hint .ttl{display:block} }
  #app{display:flex;flex:1 1 auto;min-height:0;width:100%;padding:12px;gap:12px;align-items:center;justify-content:center}
  .col{display:flex;gap:10px;justify-content:center;align-items:center;flex:0 0 auto}
  .stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;align-self:stretch}
  #wrap{position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* horizontal: velocidad y sonidos | colores | lienzo | controles */
  #instruments{display:grid;gap:10px}
  .side{display:flex;gap:10px;align-items:center}
  @media (orientation:landscape){ #app{flex-direction:row} .col{flex-direction:column} #sound{flex-direction:row-reverse;gap:12px}
    .side{flex-direction:column}
    /* dos columnas: a la izquierda los de pulsos, a la derecha los continuos */
    #instruments{grid-template-rows:repeat(5,var(--key));grid-auto-flow:column}
    .stage{flex:0 1 auto;height:100%;aspect-ratio:1/1;max-width:calc(100% - 4*var(--key) - 90px)} }
  /* vertical: lienzo arriba, colores y controles debajo; arriba los de pulsos, abajo los continuos */
  @media (orientation:portrait){ :root{--key:clamp(40px,min(11vw,11vh),64px)}
    body{justify-content:center} #app{flex:0 1 auto;flex-direction:column} .col{flex-direction:row;flex-wrap:wrap}
    #sound{order:2;flex-wrap:nowrap} #controls{order:3} #instruments{gap:8px}
    #instruments{grid-template-columns:repeat(5,var(--key))}
    .stage{order:1;flex:0 1 auto;width:100%;aspect-ratio:1/1;max-height:calc(100% - 3*var(--key) - 70px)} }

  button{font:inherit;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
    width:var(--key);height:var(--key);border-radius:50%;padding:0;
    display:flex;align-items:center;justify-content:center;transition:transform .1s ease}
  button:active{transform:scale(.9)}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  button svg{width:44%;height:44%}

  .inst{background:var(--c);border-color:var(--c);color:#fff}
  .inst.px{border-radius:6px}
  .inst svg{width:52%;height:52%}
  .tool.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .tool.on,.inst.on{box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--ink)}
  #play{background:var(--ink);border-color:var(--ink);color:#fff;width:calc(var(--key)*1.15);height:calc(var(--key)*1.15)}
  .speed{display:flex;gap:2px;padding:2px;border:1.5px solid var(--line);border-radius:999px}
  .speed{flex-direction:column}
  .speed button{border:none;width:calc(var(--key)*.8);height:calc(var(--key)*.8);opacity:.4}
  .speed button svg{width:62%;height:62%}
  .speed button.on{opacity:1;background:#f1f0ec}
  .speed .dot{width:26%;height:26%;border-radius:50%;background:var(--ink);display:block}
  #trash.armed{background:#e2523f;border-color:#e2523f;color:#fff;animation:wig .25s ease-in-out infinite alternate}
  @keyframes wig{from{rotate:-8deg}to{rotate:8deg}}

  #hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:1em;
    flex-direction:column;pointer-events:none;color:var(--mute);font-size:clamp(15px,2.4vmin,22px);text-align:center;line-height:1.35;transition:opacity .4s}

  .overlay{display:none;position:fixed;inset:0;background:rgba(29,29,27,.35);z-index:30;align-items:center;justify-content:center}
  .overlay.show{display:flex}
  #panel{z-index:40}
  .overlay .box{background:#fff;border-radius:16px;padding:18px;width:min(520px,92vw);display:flex;flex-direction:column;gap:10px}
  .overlay h2{margin:0;font-size:19px}
  #panel p{margin:0;font-size:15px;line-height:1.35;color:#55524d}
  #panel textarea{width:100%;height:84px;border-radius:10px;border:1.5px solid var(--line);padding:8px;font:12px/1.3 ui-monospace,monospace;resize:none;user-select:text;-webkit-user-select:text}
  .overlay .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .overlay .row button{width:auto;height:auto;border-radius:999px;padding:9px 16px;font-size:16px}
  #panel #copy{background:var(--ink);border-color:var(--ink);color:#fff}
  #panel .msg{font-size:15px;min-height:1.2em}
  .gbox{width:min(720px,94vw)!important;max-height:92vh}
  #tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;overflow-y:auto;padding:4px}
  .tile{position:relative;width:100%;height:auto;aspect-ratio:1/1;border-radius:12px;background:var(--paper);overflow:visible}
  .tile canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:11px}
  .tile.cur{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
  .tile.new{color:var(--mute);border-style:dashed}
  .tile.new svg{width:36%;height:36%}
  .tile .del{position:absolute;top:-8px;right:-8px;width:30px;height:30px;background:#fff;z-index:2}
  .tile .del svg{width:50%;height:50%}
  .tile .del.armed{background:#e2523f;border-color:#e2523f;color:#fff}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<h1 id="title" class="ttl" aria-label="Dibuja tu música"></h1>
<div id="app">
  <div class="col" id="sound">
    <div id="instruments" role="radiogroup" aria-label="Instrumento"></div>
    <div class="side">
    <div class="speed" role="radiogroup" aria-label="Velocidad">
      <button data-bpm="80" aria-label="Lento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 16a7.5 7.5 0 0 1 15 0z"/><path d="M7 16v-3.5h6V16M10 8.5v4"/><circle cx="20" cy="13" r="2"/><path d="M17.3 14.6l1-.6M5.5 16v2.5M14.5 16v2.5"/></svg></button>
      <button data-bpm="120" class="on" aria-label="Normal"><i class="dot"></i></button>
      <button data-bpm="160" aria-label="Rápido"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="15.5" r="5"/><path d="M10 10.8 8.6 4.2a1.4 1.4 0 0 1 2.7-.6l1 6.9"/><path d="M14 10.8l1.4-6.6a1.4 1.4 0 0 0-2.7-.6l-1 6.9"/><circle cx="10.2" cy="15" r=".6" fill="currentColor"/><circle cx="13.8" cy="15" r=".6" fill="currentColor"/></svg></button>
    </div>
    <button id="kit" aria-label="Sonidos"></button>
    </div>
  </div>
  <div class="stage">
    <div id="wrap">
      <canvas id="cv"></canvas>
      <div id="hint"><div class="ttl" aria-hidden="true"></div><div>Elige un color, dibuja y pulsa play</div></div>
    </div>
  </div>
  <div class="col" id="controls">
    <button id="play" aria-label="Reproducir"></button>
    <button id="eraser" class="tool" aria-label="Goma de borrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 4.5 5 5-9 9H6l-2.5-2.5a1.5 1.5 0 0 1 0-2.1z"/><path d="m9.5 9.5 5 5"/><path d="M11 20h9"/></svg></button>
    <button id="undo" aria-label="Deshacer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5 4 10l5 5"/><path d="M4 10h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button id="trash" aria-label="Borrar todo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg></button>
    <button id="lib" aria-label="Mis dibujos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
  </div>
</div>

<div id="gallery" class="overlay">
  <div class="box gbox" role="dialog" aria-labelledby="gtitle">
    <h2 id="gtitle">Mis dibujos</h2>
    <div id="tiles"></div>
    <div class="row">
      <button id="gcode">Código</button>
      <button id="gclose">Cerrar</button>
    </div>
  </div>
</div>

<div id="panel" class="overlay">
  <div class="box" role="dialog" aria-labelledby="ptitle">
    <h2 id="ptitle">Código del dibujo</h2>
    <p>Copia este código para mandar tu dibujo a otra persona. Para abrir uno que te hayan mandado, pega su código y pulsa Abrir: se añadirá a Mis dibujos.</p>
    <textarea id="code" spellcheck="false" aria-label="Código del dibujo"></textarea>
    <div class="msg" id="msg"></div>
    <div class="row">
      <button id="close">Cerrar</button>
      <button id="load">Abrir</button>
      <button id="copy">Copiar código</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ---------- Configuración musical ----------
  const STEPS = 32;            // columnas de tiempo en un bucle
  const ROWS = 15;             // filas de altura
  // 10 colores. El número de cada color es el que se guarda en el código del dibujo: no reordenar.
  // 0-4 van a pulsos (una nota en cada cruce); 5-9 son continuos (el trazo es una nota que se desliza).
  // Cada color se comporta igual en todos los juegos de sonidos; solo cambia cómo suena.
  const SLOTS = [
    {color:'#efa52f'}, {color:'#4a6fd6'}, {color:'#2f9a72'}, {color:'#4fb3d9'}, {color:'#a77b54'},
    {color:'#de5b3c', hold:true}, {color:'#e07bb5', hold:true}, {color:'#7d63d1', hold:true},
    {color:'#93c13e', hold:true}, {color:'#5f7186', hold:true},
  ];
  const ICON = {
    campana:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
    piano:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 12v7M15 12v7"/><path d="M7.5 5v6.5M10.5 5v6.5M13.5 5v6.5M16.5 5v6.5"/>',
    tambor:'<ellipse cx="12" cy="10" rx="8" ry="3"/><path d="M4 10v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/><path d="M8 3l3 5M16 3l-3 5"/>',
    gotas:'<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>',
    palmas:'<path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V11M11 11V5a1.5 1.5 0 0 1 3 0v6M14 11V6.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-.5a5 5 0 0 1-4-2l-3-4a1.5 1.5 0 0 1 2.3-1.9L8 14"/><path d="M3 7l2 1M5 3l1.5 2.5"/>',
    trompeta:'<path d="M2.5 10v4M3 12h10"/><path d="M13 12l8-5.5v11z"/><path d="M6.5 8.5V12M9.5 8.5V12"/>',
    guitarra:'<path d="M13.5 10.5 20 4"/><path d="M18.5 2.5l3 3"/><path d="M11 9.6a4 4 0 0 0-5.6.4 3 3 0 0 0 .3 4 3 3 0 0 1-1 2.4 3 3 0 0 0 4 4 3 3 0 0 1 2.4-1 3 3 0 0 0 4-.3 4 4 0 0 0 .4-5.6z"/><circle cx="9.8" cy="14.2" r="1.2"/>',
    flauta:'<path d="M3 17.5 17.5 3M6.5 21 21 6.5M3 17.5l3.5 3.5M17.5 3 21 6.5"/><circle cx="9.3" cy="14.7" r=".9"/><circle cx="12" cy="12" r=".9"/><circle cx="14.7" cy="9.3" r=".9"/>',
    organo:'<rect x="4.5" y="10" width="3.2" height="10" rx="1"/><rect x="10.4" y="4" width="3.2" height="16" rx="1"/><rect x="16.3" y="7.5" width="3.2" height="12.5" rx="1"/><path d="M5.3 16.5h1.6M11.2 16.5h1.6M17.1 16.5h1.6"/>',
    acordeon:'<rect x="2.5" y="5.5" width="4" height="13" rx="1.2"/><rect x="17.5" y="5.5" width="4" height="13" rx="1.2"/><path d="M6.5 7.5 9.5 16.5 12 7.5 14.5 16.5 17.5 7.5"/>',
    estrella:'<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>',
    destello:'<path d="M12 2.5v6M12 15.5v6M2.5 12h6M15.5 12h6"/><circle cx="12" cy="12" r="2.2"/>',
    meteorito:'<circle cx="9" cy="15" r="5.5"/><circle cx="7.6" cy="13.8" r="1"/><path d="M13.5 10.5 20 4M11 8.5l5-5M15.5 13l5-5"/>',
    burbujas:'<circle cx="9" cy="14" r="5"/><circle cx="17" cy="7" r="3"/><circle cx="18" cy="16" r="1.6"/>',
    radar:'<path d="M4 20.5h10M9 20.5v-4"/><path d="M4.5 12.5a6 6 0 0 0 8.5-8.5z"/><path d="M15 6.5a4 4 0 0 1 2.5 2.5M16 3a8 8 0 0 1 5 5"/>',
    cometa:'<circle cx="16.5" cy="7.5" r="3.5"/><path d="M13.7 10.3 3 21M12.5 7.5 5 15M16.5 11.5 9 19"/>',
    planeta:'<circle cx="12" cy="12" r="5.5"/><path d="M6.6 15.9C3.4 18.4 2.1 20.6 3.3 21.3c1.9 1.1 7.6-1.3 12.3-5.4s7.4-8.6 5.9-9.9c-.8-.7-2.4-.4-4.6.8"/>',
    ovni:'<ellipse cx="12" cy="14" rx="9.5" ry="3.5"/><path d="M7.5 11.5a4.5 4.5 0 0 1 9 0"/><path d="M8 20l-1 1.5M16 20l1 1.5M12 18v3"/>',
    nebulosa:'<path d="M12 12a1.5 1.5 0 1 1 1.5 1.5 3.5 3.5 0 0 1-3.5-3.5 4.5 4.5 0 0 1 4.5-4.5 6 6 0 0 1 6 6 7.5 7.5 0 0 1-7.5 7.5A8.5 8.5 0 0 1 4.5 10.5"/>',
    sol:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>',
    nota:'<circle cx="8.5" cy="17.5" r="3"/><path d="M11.5 17.5V4c1.8 1.6 5 2.2 6 5.5"/>',
    mando:'<path d="M7.5 7h9a5 5 0 0 1 4.7 6.7l-.9 2.6a2.5 2.5 0 0 1-4.1.9L14 15h-4l-2.2 2.2a2.5 2.5 0 0 1-4.1-.9l-.9-2.6A5 5 0 0 1 7.5 7z"/><path d="M7.5 10v3M6 11.5h3"/><circle cx="15.5" cy="10.5" r=".9" fill="currentColor"/><circle cx="17.5" cy="12.8" r=".9" fill="currentColor"/>',
    cohete:'<path d="M12 2.5c3 2.5 4.5 6 4 10.5l-2 3h-4l-2-3C7.5 8.5 9 5 12 2.5z"/><circle cx="12" cy="9.5" r="1.6"/><path d="M8.2 13 5 16l1 3 3-2.5M15.8 13l3.2 3-1 3-3-2.5M10.5 19.5 12 22l1.5-2.5"/>',
  };
  // Juegos de sonidos: cada uno con su escala (siempre suena bien, toques donde toques).
  // Los sonidos están en el apartado Audio (SOUNDS). icon:null = botón cuadrado sin icono.
  const KITS = [
    {id:'clasico',    name:'Clásico',    icon:'nota',   scale:[0,2,4,7,9],    base:48,   // pentatónica de Do
     names:['Campanita','Piano','Tambor','Gotas','Palmas','Trompeta','Guitarra','Flauta','Órgano','Acordeón'],
     icons:['campana','piano','tambor','gotas','palmas','trompeta','guitarra','flauta','organo','acordeon']},
    {id:'videojuego', name:'Videojuego', icon:'mando',  scale:[0,3,5,7,10],   base:48,   // pentatónica menor de Do
     names:['Moneda','Bip','Batería','Salto','Chasquido','Láser','Bajo','Silbato','Nave','Power-up'],
     icons:null},
    {id:'espacio',    name:'Espacio',    icon:'cohete', scale:[0,2,4,6,8,10], base:48,   // tonos enteros
     names:['Estrella','Púlsar','Meteoritos','Burbujas','Radar','Cometa','Planeta','Ovni','Nebulosa','Viento solar'],
     icons:['estrella','destello','meteorito','burbujas','radar','cometa','planeta','ovni','nebulosa','sol']},
  ];
  let kit = 0;
  const rowToMidi = r => { const k = KITS[kit], n = k.scale.length; return k.base + 12*Math.floor(r/n) + k.scale[r%n]; };
  const SVG_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';

  // ---------- Estado ----------
  let strokes = [];            // {i: instrumento, p: [[x,y],...]} coords 0..1
  let current = 0;
  let bpm = 120;
  let playing = false;
  let schedule = [];           // por columna: lista de notas
  const live = new Map();      // trazos en curso por pointerId
  const glow = new Map();      // índice de trazo -> momento de brillo
  const particles = [];
  let tool = 'draw';           // 'draw' | 'erase'
  let eraserAt = null;         // posición de la goma para pintar su círculo
  const ERASE_R = 0.035;
  const history = [];          // instantáneas para deshacer
  const snapshot = () => { history.push(JSON.stringify(strokes)); if (history.length>40) history.shift(); };

  // ---------- Interfaz ----------
  const instBox = document.getElementById('instruments');
  const instBtns = SLOTS.map((sl, idx) => {
    const b = document.createElement('button');
    b.className = 'inst' + (idx===0?' on':'');
    b.style.setProperty('--c', sl.color);
    b.addEventListener('click', () => {
      current = idx; tool = 'draw';
      document.querySelectorAll('.inst,.tool').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      ensureAudio(); preview(idx, 7);
    });
    instBox.appendChild(b);
    return b;
  });
  const kitBtn = document.getElementById('kit');
  // pinta los botones con los nombres e iconos del juego de sonidos actual
  function paintKit(){
    const k = KITS[kit];
    instBtns.forEach((b, idx) => {
      b.classList.toggle('px', !k.icons);
      b.innerHTML = k.icons ? SVG_OPEN + ICON[k.icons[idx]] + '</svg>' : '';
      b.setAttribute('aria-label', k.names[idx]);
    });
    kitBtn.innerHTML = SVG_OPEN + ICON[k.icon] + '</svg>';
    kitBtn.setAttribute('aria-label', 'Sonidos: ' + k.name + '. Pulsa para cambiar');
  }
  function setKit(n){ kit = n; paintKit(); redrawBase(); }
  kitBtn.addEventListener('click', () => {
    setKit((kit+1) % KITS.length); save();
    ensureAudio(); preview(current, 7);
  });
  const eraser = document.getElementById('eraser');
  eraser.addEventListener('click', () => {
    tool = 'erase';
    document.querySelectorAll('.inst,.tool').forEach(x=>x.classList.remove('on'));
    eraser.classList.add('on');
  });

  function eraseAt(p){
    let changed = false; const out = [];
    strokes.forEach(s => {
      let seg = [], hit = false; const pieces = [];
      s.p.forEach(pt => {
        if (Math.hypot(pt[0]-p[0], pt[1]-p[1]) < ERASE_R){ hit = true; if (seg.length) pieces.push(seg); seg = []; }
        else seg.push(pt);
      });
      if (seg.length) pieces.push(seg);
      if (!hit){ out.push(s); return; }
      changed = true;
      pieces.forEach(pc => { if (pc.length>=2) out.push({i:s.i, p:pc}); });
    });
    if (changed){ strokes = out; glow.clear(); redrawBase(); }
  }

  // título escrito a mano por un niño, vectorizado; cada letra en el color de un instrumento

        env(g,t,0.45,0.08,0.3,0.9,0.7,end);
        const lp=filt('lowpass',1100); lp.connect(g);
        return [-9,0,9].map(c => { const o=osc('sawtooth',f,t,end+0.8); o.detune.value=c; o.connect(lp); return [o.frequency,1]; });
      }},
      {oct:12, wet:1.6, hold:(g,f,t,end) => {                                                       // viento solar: la altura cambia el brillo del soplido
        env(g,t,0.3,1.4,0.3,0.85,0.5,end);
        const n=noise(t,end+0.6), bp=filt('bandpass',f,6), gust=ac.createGain(); gust.gain.value=0.7;
        const lfo=osc('sine',0.5,t,end+0.6), lg=ac.createGain(); lg.gain.value=0.3; lfo.connect(lg); lg.connect(gust.gain);
        n.connect(bp); bp.connect(gust); gust.connect(g);
        return [[bp.frequency,1]];
      }},
    ],
  };
  const sound = i => SOUNDS[KITS[kit].id][i];

  function playNote(i, row, t, dur){
    if (!ac) return;
    const snd = sound(i), f = hz(rowToMidi(row) + snd.oct);
    // si la misma nota del mismo color aún suena, se apaga rápido: evita que se amontonen colas
    const key = i+'-'+row, prevV = voices.get(key);
    if (prevV){ try{ prevV.gain.cancelScheduledValues(t); prevV.gain.setTargetAtTime(0, t, 0.015); }catch(_){} }
    const vg = ac.createGain(); vg.gain.value = 1; voices.set(key, vg);
    const g = ac.createGain(); g.connect(vg); out(vg, snd.wet ?? 1);
    if (snd.hold) snd.hold(g, f, t, t+Math.max(0.15,dur*0.95));
    else snd.hit(g, f, t, row, dur);
  }
  // Un trazo de color continuo = una sola nota que se desliza por la escala
  function playPhrase(n, t, sd){
    if (!ac) return;
    const snd = sound(n.i);
    const fs = n.rows.map(r => hz(rowToMidi(r) + snd.oct));
    const g = ac.createGain(); out(g, snd.wet ?? 1);
    const P = snd.hold(g, fs[0], t, t + n.rows.length*sd*0.97);
    for (let k=1;k<fs.length;k++){
      if (fs[k]===fs[k-1]) continue;
      P.forEach(([param, m]) => param.setTargetAtTime(fs[k]*m, t+k*sd, 0.035)); // deslizamiento ~0,1 s
    }
  }
  function preview(i, row){ if (!ac) return; playNote(i, row, ac.currentTime+0.01, 0.15); }

  // ---------- Secuenciador ----------
  let nextStep=0, nextTime=0, loopStart=0, timer=null;
  const stepDur = () => 60/bpm/2;
  const playBtn = document.getElementById('play');
  const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.4-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z" fill="#fff"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="#fff"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>';
  playBtn.innerHTML = ICON_PLAY;

  function tick(){
    while (nextTime < ac.currentTime + 0.12){
      const sd = stepDur();
      schedule[nextStep]?.forEach(n => {
        if (n.glide) playPhrase(n, nextTime, sd);
        else if (!n.visual) playNote(n.i, n.row, nextTime, n.len*sd);
        const delay = (nextTime - ac.currentTime)*1000;
        setTimeout(() => hit(n), Math.max(0,delay));
      });
      nextStep++; nextTime += sd;
      if (nextStep>=STEPS){ nextStep=0; loopStart = nextTime; }
    }
  }
  function hit(n){
    glow.set(n.si, performance.now());
    const col = SLOTS[n.i].color;
    particles.push({x:n.x*W, y:n.y*H, vx:0, vy:0, life:1, c:col, r:9*DPR, ring:true});
  }
  function start(){
    ensureAudio(); if (!ac) return;
    rebuild();
    playing = true; playBtn.innerHTML=ICON_PAUSE; playBtn.setAttribute('aria-label','Pausa');
    nextStep = 0; nextTime = ac.currentTime + 0.06; loopStart = nextTime;
    timer = setInterval(tick, 25); tick();
  }
  function stop(){
    playing=false; clearInterval(timer); playBtn.innerHTML=ICON_PLAY; playBtn.setAttribute('aria-label','Reproducir');
  }
  playBtn.addEventListener('click', () => playing?stop():start());

  document.querySelectorAll('.speed button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.speed button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const old = stepDur(); bpm = +b.dataset.bpm;
    if (playing && ac){ // mantener la posición del cabezal
      const prog = (ac.currentTime - loopStart)/(old*STEPS);
      loopStart = ac.currentTime - prog*stepDur()*STEPS;
    }
    save();
  }));

  // ---------- Bucle de pintado ----------
  function frame(){
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(base,0,0);
    const now = performance.now();
    glow.forEach((t0, si) => {
      const k = 1-(now-t0)/350;
      if (k<=0 || !strokes[si]){ glow.delete(si); return; }
      ctx.save(); ctx.globalAlpha = 0.35*k;
      strokePath(ctx, strokes[si], lw()*(1.6+1.4*k)); ctx.restore();
      ctx.save(); strokePath(ctx, strokes[si], lw()*(1+0.4*k)); ctx.restore();
    });
    for (let k=particles.length-1;k>=0;k--){
      const p = particles[k];
      p.life-=0.03;
      if (p.life<=0){ particles.splice(k,1); continue; }
      const grow = 1-p.life;
      ctx.globalAlpha = p.life*0.5; ctx.strokeStyle=p.c; ctx.lineWidth=2*DPR;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(0.6+grow*1.6),0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha = Math.min(1,p.life*1.6); ctx.fillStyle='#1d1d1b';
      ctx.beginPath(); ctx.arc(p.x,p.y,4*DPR,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    if (eraserAt){
      ctx.beginPath(); ctx.arc(eraserAt[0]*W, eraserAt[1]*H, ERASE_R*W, 0, Math.PI*2);
      ctx.fillStyle='rgba(29,29,27,.06)'; ctx.fill(); ctx.lineWidth=1.5*DPR; ctx.strokeStyle='#1d1d1b'; ctx.stroke();
    }
    if (playing && ac){
      const prog = ((ac.currentTime - loopStart)/(stepDur()*STEPS));
      const x = (((prog%1)+1)%1)*W;
      ctx.fillStyle='#1d1d1b'; ctx.fillRect(x-0.75*DPR,0,1.5*DPR,H);
    }
    requestAnimationFrame(frame);
  }

  // ---------- Deshacer / borrar ----------
  document.getElementById('undo').addEventListener('click', () => {
    if (!history.length) return;
    strokes = JSON.parse(history.pop()); glow.clear(); rebuild(); redrawBase(); save();
  });
  const trash = document.getElementById('trash'); let armT=null;
  trash.addEventListener('click', () => {
    if (!trash.classList.contains('armed')){
      trash.classList.add('armed'); armT=setTimeout(()=>trash.classList.remove('armed'),2000); return;
    }
    clearTimeout(armT); trash.classList.remove('armed');
    snapshot(); strokes=[]; glow.clear(); particles.length=0; rebuild(); redrawBase(); save();
  });

  // ---------- Guardar / cargar ----------
  const B36 = n => Math.round(n*1295).toString(36).padStart(2,'0');
  function encode(){
    const parts = strokes.map(s => {
      let out = String(s.i), last=null;
      s.p.forEach((pt,k) => {
        if (last && k<s.p.length-1 && Math.hypot(pt[0]-last[0],pt[1]-last[1])<0.012) return;
        out += B36(pt[0]) + B36(pt[1]); last=pt;
      });
      return out;
    });
    return 'v2' + (bpm===80?'a':bpm===160?'c':'b') + 'abc'[kit] + parts.join('.');
  }
  // Código v2: 'v2' + velocidad (a/b/c) + juego de sonidos (a/b/c) + trazos separados por '.'
  // Cada trazo: dígito del color (0-9) + coordenadas en base36, 2 caracteres por eje.
  // Los v1 (prototipo, 8 colores en otro orden) se abren con el sonido Clásico.
  const V1_MAP = [0,1,5,6,2,7,3,4];
  function decode(str){
    str = (str||'').trim();
    const v1 = str.startsWith('v1');
    if (!v1 && !str.startsWith('v2')) throw new Error('código');
    const sp = {a:80,b:120,c:160}[str[2]] || 120;
    const k = v1 ? 0 : Math.max(0, 'abc'.indexOf(str[3]));
    const body = str.slice(v1 ? 3 : 4);
    const out = body ? body.split('.').map(part => {
      let i = +part[0];
      if (v1) i = V1_MAP[i];
      if (!(i>=0 && i<SLOTS.length)) throw new Error('código');
      const p=[];
      for (let k=1;k+3<part.length;k+=4){
        const x=parseInt(part.substr(k,2),36)/1295, y=parseInt(part.substr(k+2,2),36)/1295;
        if (isNaN(x)||isNaN(y)) throw new Error('código');
        p.push([x,y]);
      }
      // re-densificar
      const dense=[]; p.forEach((pt,k)=>{ if(k){ const a=p[k-1], d=Math.hypot(pt[0]-a[0],pt[1]-a[1]), n=Math.max(1,Math.ceil(d/0.01)); for(let j=1;j<=n;j++) dense.push([a[0]+(pt[0]-a[0])*j/n, a[1]+(pt[1]-a[1])*j/n]); } else dense.push(pt); });
      return {i, p:dense};
    }) : [];
    return {strokes:out, bpm:sp, kit:k};
  }
  function apply(d){
    strokes = d.strokes; bpm = d.bpm; kit = d.kit ?? kit; paintKit();
    document.querySelectorAll('.speed button').forEach(b=>b.classList.toggle('on', +b.dataset.bpm===bpm));
    glow.clear(); rebuild(); redrawBase();
  }
  // ---------- Mis dibujos (se guardan en este navegador) ----------
  const LIB_KEY='dibuja-musica-lib', CUR_KEY='dibuja-musica-cur';
  const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  let curId = newId();
  function readLib(){ try{ return JSON.parse(localStorage.getItem(LIB_KEY)) || []; }catch(_){ return []; } }
  function writeLib(l){ try{ localStorage.setItem(LIB_KEY, JSON.stringify(l)); localStorage.setItem(CUR_KEY, curId); }catch(_){} }
  function save(){
    const lib = readLib(), k = lib.findIndex(e => e.id===curId);
    if (!strokes.length){ if (k>=0) lib.splice(k,1); }        // un dibujo vacío no se guarda
    else { const e = {id:curId, code:encode(), t:Date.now()}; if (k>=0) lib[k]=e; else lib.push(e); }
    writeLib(lib);
  }
  function openEntry(e){
    curId = e ? e.id : newId(); history.length = 0;
    apply(e ? decode(e.code) : {strokes:[], bpm, kit});
    save();
  }
  function newDrawing(){ save(); openEntry(null); }
  function restore(){
    try{
      const lib = readLib();
      const h = location.hash.startsWith('#d=') ? decodeURIComponent(location.hash.slice(3)) : null;
      if (h){ curId = newId(); apply(decode(h)); save(); return; }
      const cur = localStorage.getItem(CUR_KEY);
      const e = lib.find(x => x.id===cur) || lib.slice().sort((a,b)=>b.t-a.t)[0];
      if (e){ curId = e.id; apply(decode(e.code)); }
    }catch(_){}
  }

  const gallery = document.getElementById('gallery'), tiles = document.getElementById('tiles');
  const SVGO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">';
  function drawThumb(cnv, code){
    const sz = 192; cnv.width = cnv.height = sz; const c = cnv.getContext('2d');
    c.fillStyle='#fcfcfa'; c.fillRect(0,0,sz,sz);
    let d; try{ d = decode(code); }catch(_){ return; }
    c.lineCap='round'; c.lineJoin='round'; c.lineWidth = 4;
    d.strokes.forEach(st => { c.strokeStyle = SLOTS[st.i].color; c.beginPath();
      st.p.forEach(([x,y],k) => k ? c.lineTo(x*sz,y*sz) : c.moveTo(x*sz,y*sz)); c.stroke(); });
  }
  function renderGallery(){
    save();
    const lib = readLib().sort((a,b)=>b.t-a.t);
    tiles.innerHTML = '';
    const nb = document.createElement('button'); nb.className='tile new'; nb.setAttribute('aria-label','Nuevo dibujo');
    nb.innerHTML = SVGO+'<path d="M12 5v14M5 12h14"/></svg>';
    nb.addEventListener('click', () => { newDrawing(); gallery.classList.remove('show'); });
    tiles.appendChild(nb);
    lib.forEach((e, n) => {
      const t = document.createElement('button'); t.className = 'tile'+(e.id===curId?' cur':'');
      t.setAttribute('aria-label','Abrir dibujo '+(lib.length-n));
      const cnv = document.createElement('canvas'); drawThumb(cnv, e.code); t.appendChild(cnv);
      const del = document.createElement('button'); del.className='del'; del.setAttribute('aria-label','Borrar este dibujo');
      del.innerHTML = SVGO+'<path d="M6 6l12 12M18 6 6 18"/></svg>';
      let armT2 = null;
      del.addEventListener('click', ev => {
        ev.stopPropagation();
        if (!del.classList.contains('armed')){ del.classList.add('armed'); armT2=setTimeout(()=>del.classList.remove('armed'),2000); return; }
        clearTimeout(armT2);
        writeLib(readLib().filter(x => x.id!==e.id));
        if (e.id===curId){ const rest = readLib().sort((a,b)=>b.t-a.t); openEntry(rest[0]||null); }
        renderGallery();
      });
      t.appendChild(del);
      t.addEventListener('click', () => { if (e.id!==curId){ save(); openEntry(e); } gallery.classList.remove('show'); });
      tiles.appendChild(t);
    });
  }
  document.getElementById('lib').addEventListener('click', () => { renderGallery(); gallery.classList.add('show'); });
  document.getElementById('gclose').addEventListener('click', () => gallery.classList.remove('show'));
  gallery.addEventListener('click', e => { if (e.target===gallery) gallery.classList.remove('show'); });
  tiles.addEventListener('pointerdown', e => e.stopPropagation());

  const panel = document.getElementById('panel'), code = document.getElementById('code'), msg = document.getElementById('msg');
  document.getElementById('gcode').addEventListener('click', () => {
    code.value = encode(); msg.textContent=''; panel.classList.add('show');
  });
  document.getElementById('close').addEventListener('click', () => panel.classList.remove('show'));
  document.getElementById('copy').addEventListener('click', async () => {
    try{ await navigator.clipboard.writeText(code.value); msg.textContent='Código copiado'; }
    catch(_){ code.focus(); code.select(); msg.textContent='Selecciona el texto y cópialo a mano'; }
  });
  document.getElementById('load').addEventListener('click', () => {
    try{ const d = decode(code.value); save(); curId = newId(); history.length = 0; apply(d); save();
         panel.classList.remove('show'); gallery.classList.remove('show'); }
    catch(_){ msg.textContent='Ese código no es de un dibujo. Copia el código completo y vuelve a pegarlo.'; }
  });
  code.addEventListener('pointerdown', e => e.stopPropagation());

  // ---------- Arranque ----------
  paintKit(); fit(); restore(); rebuild(); redrawBase();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
